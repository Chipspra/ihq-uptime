# GitHub turns off timed checks in a repository with no changes for 60 days. On the 1st of each month this writes
# today's date to alive.txt, which counts as a change and keeps the site-up check running.
name: Keep alive
on:
  schedule:
    - cron: '7 12 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > alive.txt
          git config user.name "keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alive.txt
          git commit -m "Keep the site-up check running" || exit 0
          git push
